name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "scripts/ui-check.ps1"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "scripts/ui-check.ps1"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test core
        run: cargo test -p neria-core --locked
      # The desktop's unit tests and the UI guardrails (colours, keyboard, labels, widths).
      - name: Test app and UI rules
        run: cargo test -p neria --locked
      # No release build or uploaded exe here: Release (on a tag) builds the exe, and a Windows
      # release build is the longest step (~7.5 min at 2x minutes) and the only artifact storage.
