name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test core
        run: cargo test -p neria-core --locked
      # The desktop's unit tests and the UI guardrails (colours, keyboard, labels, widths).
      - name: Test app and UI rules
        run: cargo test -p neria --locked
      - name: Build app
        run: cargo build --release -p neria --locked
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: neria-${{ github.sha }}
          path: target/release/neria.exe
          retention-days: 14
