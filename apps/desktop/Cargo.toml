[package]
name = "neria"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neria desktop: fast, portable video downloader."

[dependencies]
neria-core = { path = "../../crates/neria-core" }
neria-player = { path = "../../crates/neria-player" }
glow = "0.18"
anyhow.workspace = true
slint = { version = "1.18", features = ["unstable-winit-030"] }
rfd = "0.17"
arboard = { version = "3.7", default-features = false }
open = "5"
trash = "5"

# Our own drop target, so links dragged from a browser land too (winit only takes files).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
windows-core = "0.62"

[build-dependencies]
slint-build = "1.18"
