[package]
name = "neria-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-agnostic core of Neria: tool management, yt-dlp/ffmpeg orchestration, download queue."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "7"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.25"
hmac = "0.12"
sha1 = "0.10"
# yt-dlp's onedir build (ytdlp.rs), checked against its release's SHA2-256SUMS.
sha2 = "0.10"
# Drawing chat (chat_draw.rs): text, shapes, emote pictures.
ab_glyph = "0.2"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg"] }
# "Clip that" (voice.rs): keyword spotting, its model fetched as a .tar.bz2.
sherpa-onnx = "=2.0.2"
bzip2 = "0.6"
tar = "0.4"
# Kick's live chat (chat.rs) comes over a websocket (Pusher).
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "native-tls"] }
# Phone (phone.rs): the QR code that pairs a phone.
qrcode = { version = "0.14", default-features = false }

# Instant replay's sound (capture_sound.rs): what the PC plays, one app's sound, the mic (WASAPI).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
